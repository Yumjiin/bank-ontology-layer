services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bank}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bank}
      POSTGRES_DB: ${POSTGRES_DB:-bank}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bank} -d ${POSTGRES_DB:-bank}"]
      interval: 3s
      timeout: 3s
      retries: 20

  # 스키마 생성 + 목데이터 적재 후 종료함 (담당: 지영)
  seed:
    build: ./data
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Ontology Service (담당: 지인)
  service:
    build: ./service
    env_file: .env
    environment:
      ONTOLOGY_PATH: /app/ontology/ontology.yaml
    volumes:
      - ./ontology:/app/ontology:ro
    ports:
      - "8001:8000"
    depends_on:
      seed:
        condition: service_completed_successfully

  # Streamlit 데모 + 에이전트 (담당: 수민)
  app:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file: .env
    environment:
      ONTOLOGY_API_URL: http://service:8000
    ports:
      - "8502:8501"
    depends_on:
      - service

  # 평가 (담당: 지영). 평소 docker compose up에는 포함되지 않고 실행할 때만 띄움
  #   docker compose run --rm eval            # 조건 A·B 각 3회
  #   docker compose run --rm eval --dry-run  # LLM 없이 채점기 확인
  #   docker compose run --rm eval --final    # 최종 결과 (eval/results/, git에 올림)
  eval:
    build:
      context: .
      dockerfile: eval/Dockerfile
    env_file: .env
    volumes:
      - ./eval/runs:/app/eval/runs
      - ./eval/results:/app/eval/results
    depends_on:
      seed:
        condition: service_completed_successfully
    profiles: ["eval"]

volumes:
  pgdata:
