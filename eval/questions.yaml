# 평가 질문셋 (담당: 지영)
# answer는 정답 SQL을 DB(PostgreSQL, seed 적재 직후 상태)에서 실행한 결과 값으로 기록함.
#
# 문항 설계 기준
# - A·B·C 세 조건 모두 답할 수 있는 질문만 포함 (C는 온톨로지 도구로 표현 가능한 질문)
# - 정답은 숫자 하나 위주 (자동 채점용). 개수 답은 검색 도구 limit(최대 200) 이하
# - tags 첫 값은 C에서 쓰일 도구 유형(metric: get_metric, search: search_objects, link: get_linked_objects),
#   나머지는 시험하는 함정: 날짜, 시스템거래(이자·수수료), 취소, 명의인, 금액방향, 코드값, attr, 등급
# - 함정 태그는 "어기면 실제로 오답이 나오는 것"만 표시함. 정답 SQL에 조건이 있어도 어겼을 때 결과가 같으면 제외
#   (예: q03 취소, q07·q08 시스템거래, q23 취소. 해당 기간·조건에 영향을 주는 데이터가 없음)
# - 대조군: 함정을 몰라도(가장 단순한 SQL로도) 정답이 나오는 문항
#
# 참고: q12(등급)는 발표 정의 문서(semantic_definitions.yaml)에 등급 정의가 없어,
#       조건 B 프롬프트에 cust_grd_cd 정의(01 VIP, 02 일반)를 추가함 (eval/run_eval.py의 GRADE_DEFINITION)

questions:
  - id: q01
    question: 2026년 3분기(7~9월) 활성 고객 수는?
    answer: 165
    answer_sql: |
      SELECT COUNT(DISTINCT r.cust_no)
      FROM txn t
      JOIN acct_rel r ON t.acct_no = r.acct_no AND r.rel_cd = '01'
      WHERE t.txn_cd IN ('IN', 'OUT')
        AND t.cncl_yn = 'N'
        AND t.txn_dt BETWEEN '20260701' AND '20260930'
    tags: [metric, 날짜, 시스템거래, 취소, 명의인]

  - id: q02
    question: 2026년 9월 순입금액은?
    answer: 389638000
    answer_sql: |
      SELECT SUM(CASE WHEN txn_cd = 'IN' THEN amt
                      WHEN txn_cd = 'OUT' THEN -amt ELSE 0 END)
      FROM txn
      WHERE cncl_yn = 'N'
        AND txn_dt BETWEEN '20260901' AND '20260930'
    tags: [metric, 날짜, 시스템거래, 취소, 금액방향]

